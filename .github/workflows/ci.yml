name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: check · e2e · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck, lint y pruebas unitarias (cobertura del dominio)
        run: npm run check

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e
        run: npm run test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build para GitHub Pages
        run: npm run build

      - name: Build de archivo único (respaldo de la feria)
        run: npm run build:single

      - name: Artefacto dist-single
        uses: actions/upload-artifact@v7
        with:
          name: agroiq-dist-single
          path: dist-single/
          retention-days: 30

      - name: Artefacto de Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  despliegue:
    name: Despliegue a GitHub Pages
    needs: calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
